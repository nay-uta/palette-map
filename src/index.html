<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette Map</title>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --border: #d4d4d2;
    --accent: #2f6fdf;
    --danger: #d23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18181a;
      --panel: #232326;
      --text: #ececec;
      --muted: #9a9a9f;
      --border: #3a3a3f;
      --accent: #6d9cff;
      --danger: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #18181a;
    --panel: #232326;
    --text: #ececec;
    --muted: #9a9a9f;
    --border: #3a3a3f;
    --accent: #6d9cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 14px;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0; }
  .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #reset-all:hover { border-color: var(--danger); color: var(--danger); }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }

  .row-head, .row {
    display: grid;
    grid-template-columns: 20px 32px 36px 110px minmax(0, 1fr) 96px 44px 32px;
    gap: 8px;
    align-items: center;
  }
  .row-head { font-size: 12px; color: var(--muted); padding-bottom: 6px; }
  .row { margin-bottom: 6px; }
  .row .grip {
    cursor: grab; color: var(--muted); text-align: center; font-size: 16px; letter-spacing: -1px;
    user-select: none; touch-action: none;
  }
  .row .grip:hover { color: var(--text); }
  .row.dragging { background: color-mix(in srgb, var(--accent) 10%, transparent); outline: 1px dashed var(--accent); border-radius: 4px; }
  body.sorting, body.sorting * { cursor: grabbing !important; }
  .row .vis { justify-self: center; width: 16px; height: 16px; cursor: pointer; }
  .row.off > :not(.vis):not(.del) { opacity: 0.4; }
  .row input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font: inherit;
  }
  .row input.hex { font-family: Consolas, "SFMono-Regular", monospace; }
  .row input.invalid { border-color: var(--danger); outline-color: var(--danger); }
  .row input[type="color"] {
    width: 36px; height: 30px; padding: 0; border: 1px solid var(--border);
    border-radius: 4px; background: none; cursor: pointer;
  }
  .row .hsv { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; white-space: nowrap; }
  .row .base { justify-self: center; }
  .row .del {
    border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer;
    width: 32px; height: 30px; border-radius: 4px;
  }
  .row .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .btn {
    font: inherit; padding: 6px 14px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .actions .spacer { flex: 1; }

  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 12px; }
  textarea {
    width: 100%; min-height: 110px; margin-top: 8px; padding: 8px;
    border: 1px solid var(--border); border-radius: 4px; background: transparent;
    color: var(--text); font-family: Consolas, monospace; font-size: 12px; resize: vertical;
  }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

  /* 2枚の高さが揃うよう、viewBox の幅の比で横幅を配分する */
  #map { display: flex; gap: 12px; align-items: flex-start; }
  #map svg { display: block; min-width: 0; height: auto; border-radius: 4px; }
  #map svg.hue { flex: 760 1 0; }
  #map svg.sv { flex: 340 1 0; }
  @media (max-width: 900px) {
    #map { flex-direction: column; }
    #map svg.hue, #map svg.sv { flex: none; width: 100%; }
    #map svg.sv { max-width: 480px; }
  }
  .map-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .map-head h2 { margin: 0; }
  #note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  #note:empty { display: none; }

  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  label.btn { display: inline-block; }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .drop.over, #img-wrap.over { border-color: var(--accent); color: var(--accent); }
  #img-wrap { position: relative; border: 2px solid transparent; border-radius: 6px; }
  #viewport { position: relative; overflow: hidden; margin: 0 auto; }
  #img-canvas {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    cursor: crosshair;
    touch-action: none;
  }
  #img-canvas.pixelated { image-rendering: pixelated; }
  #img-canvas.panning { cursor: grabbing; }
  .zoom-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .zoom-bar .hint { margin: 0; }
  .zoom-bar .zoom { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .btn.small { padding: 2px 10px; font-size: 12px; }
  #loupe {
    position: absolute;
    pointer-events: none;
    background: #1e1e1e;
    border: 1px solid #ffffff;
    border-radius: 4px;
    padding: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  #loupe canvas { display: block; image-rendering: pixelated; }
  #loupe .info { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: #fff; font: 12px Consolas, monospace; }
  #loupe .chip { width: 14px; height: 14px; border: 1px solid #fff; border-radius: 2px; }

  @media (max-width: 600px) {
    .row-head { display: none; }
    .row { grid-template-columns: 36px 1fr 32px; grid-template-areas: "pick hex del" "name name base" "vis hsv grip"; }
    .row .grip { grid-area: grip; }
    .row .vis { grid-area: vis; }
    .row input[type="color"] { grid-area: pick; }
    .row input.hex { grid-area: hex; }
    .row input.name { grid-area: name; }
    .row .base { grid-area: base; }
    .row .del { grid-area: del; }
    .row .hsv { grid-area: hsv; }
    .row { padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <h1>Palette Map</h1>
    <button class="btn" id="reset-all" title="画像とカラーをすべて消して初期状態に戻す">すべてリセット</button>
  </div>

  <section>
    <div class="map-head">
      <h2>画像から拾う</h2>
      <div class="head-actions">
        <label class="btn">画像を開く<input type="file" id="file" accept="image/*" hidden></label>
        <button class="btn" id="eyedropper" hidden title="画面上のどこからでも色を拾う（Edge / Chrome）">画面から拾う</button>
        <button class="btn" id="img-close" hidden>画像を閉じる</button>
      </div>
    </div>
    <div class="drop" id="drop">画像をここへドロップ、Ctrl+V で貼り付け、または「画像を開く」</div>
    <div id="img-wrap" hidden>
      <div id="viewport"><canvas id="img-canvas"></canvas></div>
      <div id="loupe" hidden>
        <canvas width="120" height="120"></canvas>
        <div class="info"><span class="chip"></span><span class="hex"></span></div>
      </div>
    </div>
    <div class="zoom-bar" id="img-hint" hidden>
      <p class="hint">クリックで色（3×3 ピクセルの平均）を追加。ホイールで拡大・縮小、ドラッグで移動。</p>
      <div class="zoom">
        <span id="zoom-label">100%</span>
        <button class="btn small" id="zoom-reset">全体表示</button>
      </div>
    </div>
  </section>

  <section>
    <div class="map-head">
      <h2>カラー</h2>
      <label class="btn">JSON を読み込む<input type="file" id="json-import" accept=".json,application/json" hidden></label>
    </div>
    <div class="row-head">
      <span></span><span>表示</span><span></span><span>カラーコード</span><span>名前</span><span>HSV</span><span>基準</span><span></span>
    </div>
    <div id="rows"></div>
    <div class="actions">
      <button class="btn" id="add">＋ 行を追加</button>
      <span class="spacer"></span>
      <button class="btn primary" id="json-export">JSON を保存</button>
    </div>
    <details>
      <summary>一括貼り付け</summary>
      <textarea id="bulk" placeholder="#2B4D36 ベース&#10;#B4ECF1 アクセント&#10;| 明部 | `#8FB89A` | H136 S22 V72 | 5.0% |"></textarea>
      <p class="hint">1行に1色。各行の hex を拾い、残りの文字列の先頭部分を名前にします。</p>
      <div class="actions">
        <button class="btn" id="bulk-add">行として追加</button>
      </div>
    </details>
  </section>

  <section>
    <h2>パレットマップ</h2>
    <div id="map"></div>
    <p id="note"></p>
    <div class="actions">
      <span class="spacer"></span>
      <button class="btn primary" id="download">PNG を保存</button>
    </div>
  </section>
</main>

<script src="main.js"></script>
</body>
</html>
